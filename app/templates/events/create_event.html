{% extends "base.html" %}
{% block title %}Create Event — EventPass{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
      <h3 class="fw-bold text-dark mb-1"><i class="bi bi-calendar-plus text-primary me-2"></i> Publish New Event</h3>
      <p class="text-muted small mb-4">Set up your academic event, hall capacity, and prepare automated certificate generation.</p>

      <form method="POST" action="{{ url_for('events.create_event') }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Event Title</label>
          <input type="text" name="title" class="form-control" placeholder="e.g. National Python & AI Hackathon 2026" required />
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Category</label>
            <select name="category" class="form-select" required>
              <option value="Hackathon">Hackathon</option>
              <option value="Workshop" selected>Workshop</option>
              <option value="Seminar">Seminar</option>
              <option value="Conference">Conference</option>
              <option value="Cultural">Cultural / Sports</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Venue / Auditorium</label>
            <input type="text" name="venue" class="form-control" placeholder="e.g. Central Auditorium, CCM Campus" required />
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Date & Time</label>
            <input type="datetime-local" name="date" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Seat Capacity Ceiling</label>
            <input type="number" name="capacity" class="form-control" value="100" min="1" max="1000" required />
            <div class="form-text">Registrations will automatically close once this limit is reached.</div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold">Detailed Description & Guidelines</label>
          <textarea name="description" class="form-control" rows="5" placeholder="Specify event agenda, eligibility, requirements, and outcomes..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Publish Event to Portal</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
